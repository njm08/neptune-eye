name: Run Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          python3 tools/docker/build_docker_amd64_python.py

      - name: Run Pytest
        timeout-minutes: 5
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            njm08/neptune-eye:latest-amd64-python \
            python3 run_tests.py